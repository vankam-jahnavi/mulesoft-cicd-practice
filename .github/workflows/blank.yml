name: mule-cicd

on:
  push:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:          # manual button, used for Prod

jobs:
  # Step 1: decide the environment from the branch
  set-env:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
    steps:
      - id: pick
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref_name }}" == "main" ]]; then
            echo "target=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "target=uat" >> $GITHUB_OUTPUT
          else
            echo "target=dev" >> $GITHUB_OUTPUT
          fi

  # Step 2: one deploy job, reused for every environment
  deploy:
    needs: set-env
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.target }}   # dev / uat / prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and deploy
        run: |
          mvn -B clean deploy -DmuleDeploy \
            -Denv=${{ needs.set-env.outputs.target }} \
            -Danypoint.environment=${{ vars.ANYPOINT_ENV }} \
            -Dapp.name=${{ vars.APP_NAME }} \
            -Dreplicas=${{ vars.REPLICAS }} \
            -Dconnected.app.client_id=${{ secrets.ANYPOINT_CLIENT_ID }} \
            -Dconnected.app.client_secret=${{ secrets.ANYPOINT_CLIENT_SECRET }}
